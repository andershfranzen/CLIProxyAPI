services:
  a5proxy:
    # A5PROXY_* variables take precedence; the legacy CLI_PROXY_* names still work.
    image: ${A5PROXY_IMAGE:-${CLI_PROXY_IMAGE:-a5proxy:latest}}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: a5proxy
    # env_file:
    #   - .env
    environment:
      DEPLOY: ${DEPLOY:-}
    ports:
      - "8317:8317"
      - "8085:8085"
      - "1455:1455"
      - "54545:54545"
      - "51121:51121"
      - "11451:11451"
    volumes:
      - ${A5PROXY_CONFIG_PATH:-${CLI_PROXY_CONFIG_PATH:-./config.yaml}}:/a5proxy/config.yaml
      - ${A5PROXY_AUTH_PATH:-${CLI_PROXY_AUTH_PATH:-./auths}}:/root/.a5proxy
      - ${A5PROXY_LOG_PATH:-${CLI_PROXY_LOG_PATH:-./logs}}:/a5proxy/logs
      - ${A5PROXY_PLUGIN_PATH:-${CLI_PROXY_PLUGIN_PATH:-./plugins}}:/a5proxy/plugins
    restart: unless-stopped
