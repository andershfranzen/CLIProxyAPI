services:
  a5proxy:
    # A5PROXY_* variables take precedence; the legacy CLI_PROXY_* names still work.
    image: ${A5PROXY_IMAGE:-${CLI_PROXY_IMAGE:-a5proxy:latest}}
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        # Source of the management web panel bundled into the image.
        panel: ${A5PROXY_PANEL_PATH:-../Cli-Proxy-API-Management-Center}
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: a5proxy-cluster
    environment:
      HOME_JWT: ${HOME_JWT:-}
    ports:
      - "8317:8317"
    volumes:
      - ${A5PROXY_HOME_PATH:-${CLI_PROXY_HOME_PATH:-./home}}:/root/.a5proxy
      - ${A5PROXY_LOG_PATH:-${CLI_PROXY_LOG_PATH:-./logs}}:/a5proxy/logs
      - ${A5PROXY_PLUGIN_PATH:-${CLI_PROXY_PLUGIN_PATH:-./plugins}}:/a5proxy/plugins
    command: >
      sh -eu -c '
        if [ -z "$$HOME_JWT" ]; then
          echo "HOME_JWT is required" >&2
          exit 1
        fi

        exec ./a5proxy -home-jwt "$$HOME_JWT"
      '
    restart: unless-stopped
